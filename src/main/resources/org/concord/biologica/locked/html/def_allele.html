<p><a NAME="allele"></a><b>allele</b>&nbsp; Different forms
of the same gene. According to the Mendelian concept of a gene, a gene
is an inherited factor controlling the phenotype of a trait, and alleles
are copies of genes with some modification that alters this phenotype in
some way.
